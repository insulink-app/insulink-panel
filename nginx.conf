server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS, asked per request: a recreated api container gets a new IP,
    # and a proxy_pass with a fixed host would keep the one from startup (502).
    # With a variable nginx resolves at request time and passes the original
    # URI (/v1/...) unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_url ${CORE_URL};

    location /v1/ {
        proxy_pass $core_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
