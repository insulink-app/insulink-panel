name: Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build demo
        run: npm run build:demo
      # Photographs the overview into dist/screenshots/ (docs/SCREENSHOTS.md), so
      # the pictures are published with the demo and always show the current panel.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Take screenshots
        run: |
          npx vite preview --mode demo --port 4173 --strictPort &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:4173/insulink-panel/
          node e2e/demo-screenshots.mjs http://localhost:4173/insulink-panel/ dist/screenshots
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
