server {
    listen 8081;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The session tokens live in cookies the page script can read, so a script
    # that is not ours must never run here. Everything is served from this
    # origin; the only outside sources are the route map's tiles and the Open
    # Food Facts search. Inline styles stay allowed: the UI kit and the map set
    # style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://services.arcgisonline.com; font-src 'self'; connect-src 'self' https://world.openfoodfacts.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Docker's DNS, asked per request: a recreated api container gets a new IP,
    # and a proxy_pass with a fixed host would keep the one from startup (502).
    # With a variable nginx resolves at request time and passes the original
    # URI (/v1/...) unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_url ${CORE_URL};

    location /v1/ {
        proxy_pass $core_url;
        proxy_set_header Host $host;
        # The public proxy in front already set the client's address; passing
        # $remote_addr would hand the api the proxy's, which the sign-in
        # throttle and the session record would then take for the client's.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
